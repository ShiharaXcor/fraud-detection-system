version: '3.8'

services:

  backend:
    build:
      context    : .
      dockerfile : Dockerfile.backend
    container_name : fraud_backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test     : ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval : 30s
      timeout  : 10s
      retries  : 3

  frontend:
    build:
      context    : .
      dockerfile : Dockerfile.frontend
    container_name : fraud_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  models: